[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The APK's game library: Android's NativeActivity starts the official game here (docs/android.md)"

[lib]
# libhorizon.so, which the game activity loads (packaging/android).
name = "horizon"
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
horizon-game = { path = "../horizon-game" }
horizon-official = { path = "../horizon-official" }
log = "0.4"

[lints]
workspace = true
